# Render Blueprint for the NestJS API (docs: https://render.com/docs/blueprint-spec).
# Database = Neon, Redis = Upstash — paste their URLs when Render asks for the `sync: false` values.
services:
  - type: web
    name: glideinbir-kart-api
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@gk/api...
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: 'true'
      - key: LOG_LEVEL
        value: info
      # on the free plan the service sleeps when idle, so background workers only run while it is awake
      - key: WORKERS_ENABLED
        value: 'true'
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: 900
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: ORDER_PAYMENT_WINDOW_MINUTES
        value: 15
      # must be identical to SESSION_SECRET on Vercel
      - key: SESSION_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      # https://<your-service>.onrender.com
      - key: API_PUBLIC_URL
        sync: false
      # https://<your-project>.vercel.app
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAIL_FROM
        value: Glideinbir Kart <no-reply@glideinbirkart.in>
      # optional integrations — leave empty to run without them
      - key: RESEND_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
