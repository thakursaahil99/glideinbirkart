packages:
  - "apps/*"
  - "packages/*"

# Dependencies that need to run install scripts (native binaries, prisma engines…)
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

# One React for the whole monorepo (Expo SDK 57 pins 19.2.x). Prevents duplicate-React hook errors in shared packages.
overrides:
  react: 19.2.3
  react-dom: 19.2.3

# Expo/Metro load Babel plugins by name from inside their own packages; pnpm's strict layout hides those from the app.
# Hoisting only the Babel toolchain to the root node_modules keeps everything else isolated.
publicHoistPattern:
  - '@babel/*'
  - 'babel-*'
